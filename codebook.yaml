# ICOM codebook — owned by the ICOM router agent. Append-only; never reuse a retired code.
version: 1.7.0
updated: 2026-11-12
rules: {max_code_len: 6, case: UPPER for agents/clients/verbs, lower.dot for objects}
verbs:       # header slot 4; maps to house codes D/R/F/O/Q/A
  GO: start/approved to proceed
  HOLD: pause, do not proceed
  DONE: completed (house D)
  BLOCKED: cannot proceed, needs ask=
  REC: recommendation (house R); action follows verb
  FYI: info only, no reply expected
  ASK: question needing answer (house Q)
  ACK: received/understood (receive-only since 1.7.0; senders never send ACK)
  NAK: rejected/cannot parse
  DECIDE: decision on asked options (=Y/=N per item); state change, resets the no-echo window (Rule 24); not quiet  # added 1.6.0
  FLAG: relay alert to a human (echo loop, cap, unverified inbound); not quiet, never suppressed. Agents send ASK instead (card shows DEPRECATED FLAG->ASK)
  # added 1.7.0
  PARTIAL: partly completed; open items follow (done= open=)
  DO: directed action for a named owner
  OWN: claim or assign ownership
  ASSIGN: assign a task to an agent
  PLAN: plan or design ready, not executed
  FROZEN: artifact frozen for grading; no edits
  READY: artifact ready for grade or next gate
  RESULT: result of a check or run
  NOCHG: no change since last report
  RPT: report or digest
  VERDICT: grading verdict
  FAIL: gate/test failed; why= or f=
  PASS: gate/test passed; f= required
  PASS-COND: passed with conditions; conditions listed or f=
  NOTE: annotation on a prior line, no action
  PICK: option selected (answer to ask= a|b)
  RULE: standing rule stated; f= order file
  ORDER: directive from authority; f= order file
  OPEN: new item/ticket opened
priority: {P0.0: emergency (Rule 19; any agent; never suppressed; capped per sender), P0: drop everything, P1: today, P2: this week, P3: whenever}
agents:
  LEAD: lead agent (coordinates; only agent that speaks English to the owner)
  CTO: CTO / technical lead
  CRM: CRM lead
  COMMS: comms (client-facing copy, plain English)
  INT: integrations engineer
  INFRA: infra engineer
  VOICE: voice engineer
  GATE: release gate / approver for client sends
  QC: QC agent
  ICOM: ICOM router (codebook owner)
  ALL: broadcast
  OWNER: owner (human)
  # added 1.1.0
  TTL: tech team leader
  SEC: security engineer
  CFO: finance
  HRM: HR
  LIB: librarian / knowledge base
  RISK: risk manager
  LLMR: LLM researcher
  POLL: inbox poller
  WHOOK: webhook bot
  CRMB1: CRM bot 1
  CRMB2: CRM bot 2
  CL01SUP: client-01 support
  # added 1.2.0
  SYNC: sync watchdog
  AUD: auditor
  CBF: client bot factory
  CCM: command center manager
  LEGAL: legal & compliance
  BDL: biz dev lead
  # added 1.3.0
  CLBOT: client-facing bot (a2a via ICOM only; verbs FYI/ASK/ACK/NAK/DONE/BLOCKED)
clients:     # generic placeholders
  CL01: client-01
  CL02: client-02
  CL03: client-03
  CL04: client-04
  CL05: client-05
  CL06: client-06
  CL07: client-07
  CL08: client-08
  CL09: client-09
  CL10: client-10
  CL11: client-11
  CL12: client-12
  CL13: client-13
  CL14: client-14
  CL15: client-15
  CL16: client-16
  CL17: client-17
  CL18: client-18
  CL19: client-19
  CL20: client-20
  CL21: client-21
  CL22: client-22
  CL23: client-23
  CL24: client-24
  CL25: client-25
  INT0: internal / no client
objects:     # ICX concept codes (https://github.com/rstan251/icx); legacy lower.dot nouns below are tombstoned to ICX on next review
  contacts.import: contact import
  voice.agent: voice agent
  srv.migrate: server migration
  camp.reengage: re-engagement email campaign
  audit.nightly: QC nightly audit
  crm.contact: CRM contact
  crm.opp: CRM opportunity
  dns.a: DNS A record
  ssl: TLS certificate
  # added 1.4.0
  lead.new: new lead intake
  lead.book: lead booked consult
  bot.health: client bot health check
  esc.human: escalate to human
  agent.inbox: per-agent a2a mailbox
  # added 1.6.0
  echo.loop: quiet-verb echo loop (Rule 24, formerly 18)
fields:      # key=value keys
  f: file path (reference, do not restate contents)
  fn: function/service name
  v: version/deploy id
  rb: rollback target
  n: count
  err: error count
  why: reason list (comma-sep)
  ask: what you need from recipient (alternatives with |)
  nx: next step, AGENT:action
  own: owner
  cc: copy agents
  ret: what to report back
  until: deadline/resume time
  qa: test result AGENT:pass/total
  impact: client impact (0 = none)
  scope: client/tenant scope (e.g. scope=CL14)  # added 1.4.0
echo:        # added 1.6.0 — Rule 24 no-echo tunables (seconds; was rule 18)
  window_s: 21600
  loop_n: 50
  loop_s: 86400
paths:       # optional aliases, expand by prefix
  "%w": ~/work
